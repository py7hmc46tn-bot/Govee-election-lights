
name: Update Govee Election Lights

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update Govee lights
        run: python main.py
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          ELECTION_JSON_URL: ${{ secrets.ELECTION_JSON_URL }}
